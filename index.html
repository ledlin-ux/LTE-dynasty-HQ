<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LTE Dynasty HQ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080b10;
      color: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 28px 20px;
      border-bottom: 1px solid #252b36;
      background: #0d1117;
    }
    .wrap { max-width: 1200px; margin: auto; }
    h1 { margin: 0; font-size: 28px; }
    .sub { color: #8b949e; margin-top: 6px; }
    nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 16px 20px;
      border-bottom: 1px solid #252b36;
    }
    nav button {
      border: 1px solid #30363d;
      background: #161b22;
      color: white;
      border-radius: 20px;
      padding: 9px 15px;
      white-space: nowrap;
    }
    main { padding: 24px 20px 60px; }
    .hero {
      background: linear-gradient(135deg,#161b22,#101722);
      border: 1px solid #30363d;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 22px;
    }
    .hero h2 { margin-top: 0; font-size: 30px; }
    .badge {
      display: inline-block;
      background: #1f6feb;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(270px,1fr));
      gap: 16px;
    }
    .card {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 18px;
    }
    .card h3 { margin-top: 0; }
    .muted { color: #8b949e; }
    table { width: 100%; border-collapse: collapse; }
    td,th {
      padding: 11px 5px;
      border-bottom: 1px solid #21262d;
      text-align: left;
    }
    th { color:#8b949e; font-size:12px; }
    .rank {
      font-weight: 800;
      font-size: 18px;
      width: 34px;
    }
    .match {
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:12px 0;
      border-bottom:1px solid #21262d;
    }
    .loading {
      text-align:center;
      padding:70px 20px;
      color:#8b949e;
    }
    .error {
      padding:18px;
      border:1px solid #f85149;
      border-radius:12px;
    }
    footer {
      color:#6e7681;
      text-align:center;
      padding:30px;
      font-size:12px;
    }
  </style>
</head>

<body>

<header>
  <div class="wrap">
    <span class="badge">2026 SEASON</span>
    <h1>LTE Dynasty HQ</h1>
    <div class="sub">The command center for LTE Dynasty</div>
  </div>
</header>

<nav>
  <button onclick="show('dashboard')">Dashboard</button>
  <button onclick="show('power')">Power Rankings</button>
  <button onclick="show('matchups')">Matchups</button>
  <button onclick="show('odds')">Championship Odds</button>
</nav>

<main class="wrap">
  <div id="app" class="loading">
    Connecting to Sleeper…
  </div>
</main>

<footer>
  LTE Dynasty HQ • Live data powered by Sleeper
</footer>

<script>
const LEAGUE_ID = "1335326900251271168";
const API = "https://api.sleeper.app/v1";

let teams = [];
let matchups = [];
let league = {};
let currentWeek = 1;
let view = "dashboard";

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("Sleeper request failed");
  return r.json();
}

async function load() {
  try {
    const state = await getJSON(API + "/state/nfl");
    currentWeek = state.week || 1;

    const [l,u,r,m] = await Promise.all([
      getJSON(API + "/league/" + LEAGUE_ID),
      getJSON(API + "/league/" + LEAGUE_ID + "/users"),
      getJSON(API + "/league/" + LEAGUE_ID + "/rosters"),
      getJSON(API + "/league/" + LEAGUE_ID + "/matchups/" + currentWeek)
    ]);

    league = l;
    matchups = m;

    const users = Object.fromEntries(u.map(x => [x.user_id,x]));

    teams = r.map(x => {
      const user = users[x.owner_id] || {};
      const name =
        user.metadata?.team_name ||
        user.display_name ||
        "Roster " + x.roster_id;

      const wins = x.settings?.wins || 0;
      const losses = x.settings?.losses || 0;
      const ties = x.settings?.ties || 0;

      const pf =
        (x.settings?.fpts || 0) +
        ((x.settings?.fpts_decimal || 0) / 100);

      return {
        id:x.roster_id,
        name,
        wins,
        losses,
        ties,
        pf,
        points:0
      };
    });

    matchups.forEach(m => {
      const t = teams.find(x => x.id === m.roster_id);
      if (t) t.points = m.points || 0;
    });

    render();
  } catch(e) {
    document.getElementById("app").innerHTML =
      '<div class="error"><b>Could not load Sleeper data.</b><br><span class="muted">' +
      e.message + '</span></div>';
  }
}

function ranked() {
  return [...teams].sort((a,b) => {
    if (b.wins !== a.wins) return b.wins-a.wins;
    return b.pf-a.pf;
  });
}

function powerScore(t) {
  return (t.wins * 20) + (t.pf / Math.max(1,currentWeek));
}

function powerRanked() {
  return [...teams].sort((a,b)=>powerScore(b)-powerScore(a));
}

function pct(v) {
  return Math.max(1,Math.min(99,Math.round(v))) + "%";
}

function odds(t) {
  const list = powerRanked();
  const rank = list.findIndex(x=>x.id===t.id)+1;
  return {
    playoffs:pct(94-(rank-1)*7),
    seed:pct(42-(rank-1)*3.5),
    title:pct(27-(rank-1)*2)
  };
}

function standingsHTML() {
  return `
  <div class="card">
    <h3>Standings</h3>
    <table>
      <thead>
        <tr><th>#</th><th>Team</th><th>Record</th><th>PF</th></tr>
      </thead>
      <tbody>
        ${ranked().map((t,i)=>`
          <tr>
            <td class="rank">${i+1}</td>
            <td><b>${t.name}</b></td>
            <td>${t.wins}-${t.losses}${t.ties ? "-"+t.ties : ""}</td>
            <td>${t.pf.toFixed(1)}</td>
          </tr>`).join("")}
      </tbody>
    </table>
  </div>`;
}

function matchupHTML() {
  const groups = {};
  matchups.forEach(m => {
    (groups[m.matchup_id] ||= []).push(m);
  });

  return `
  <div class="card">
    <h3>Week ${currentWeek} Matchups</h3>
    ${Object.values(groups).map(g => {
      const a = teams.find(t=>t.id===g[0]?.roster_id);
      const b = teams.find(t=>t.id===g[1]?.roster_id);
      if (!a || !b) return "";
      return `
      <div class="match">
        <div><b>${a.name}</b><br><span class="muted">${a.points.toFixed(2)}</span></div>
        <div class="muted">VS</div>
        <div style="text-align:right"><b>${b.name}</b><br><span class="muted">${b.points.toFixed(2)}</span></div>
      </div>`;
    }).join("")}
  </div>`;
}

function powerHTML() {
  return `
  <div class="card">
    <h3>LTE Power Rankings</h3>
    <p class="muted">Calculated from results and scoring. Team names are attached after ranking.</p>
    <table>
      <tbody>
        ${powerRanked().map((t,i)=>`
        <tr>
          <td class="rank">${i+1}</td>
          <td><b>${t.name}</b><br><span class="muted">${t.wins}-${t.losses} • ${t.pf.toFixed(1)} PF</span></td>
        </tr>`).join("")}
      </tbody>
    </table>
  </div>`;
}

function oddsHTML() {
  return `
  <div class="card">
    <h3>Championship Board</h3>
    <table>
      <thead>
        <tr><th>Team</th><th>Playoffs</th><th>#1 Seed</th><th>Title</th></tr>
      </thead>
      <tbody>
      ${powerRanked().map(t=>{
        const o=odds(t);
        return `<tr>
          <td><b>${t.name}</b></td>
          <td>${o.playoffs}</td>
          <td>${o.seed}</td>
          <td>${o.title}</td>
        </tr>`;
      }).join("")}
      </tbody>
    </table>
    <p class="muted">Early model preview. Full Monte Carlo simulation engine coming next.</p>
  </div>`;
}

function render() {
  let content="";

  if(view==="dashboard") {
    content=`
      <div class="hero">
        <span class="badge">LIVE</span>
        <h2>${league.name || "LTE Dynasty"}</h2>
        <p class="muted">Week ${currentWeek} • ${teams.length} franchises • 7 playoff teams</p>
      </div>
      <div class="grid">
        ${standingsHTML()}
        ${matchupHTML()}
      </div>`;
  }

  if(view==="power") content=powerHTML();
  if(view==="matchups") content=matchupHTML();
  if(view==="odds") content=oddsHTML();

  document.getElementById("app").className="";
  document.getElementById("app").innerHTML=content;
}

function show(v) {
  view=v;
  render();
}

load();
</script>

</body>
</html>
