function buildMetrics(){
 let completed=Math.min(D.regWeeks,Math.max(0,D.week-1)), leagueScores=[];
 for(let wi=0;wi<completed;wi++){let ms=D.weeks[wi]||[],scores=ms.filter(m=>m.points>0).map(m=>m.points);leagueScores.push(...scores);for(let m of ms){let t=D.teams.find(x=>x.id===m.roster_id);if(!t||m.points<=0)continue;t.scores.push(m.points);for(let s of scores)if(s!==m.points){t.allN++;if(m.points>s)t.allW++;else if(m.points===s)t.allW+=.5}}}
 let lm=leagueScores.length?leagueScores.reduce((a,b)=>a+b,0)/leagueScores.length:100;
 let lsd=leagueScores.length?Math.sqrt(leagueScores.reduce((a,b)=>a+(b-lm)**2,0)/leagueScores.length):15;lsd=Math.max(10,lsd);
 for(let t of D.teams){let avg=t.scores.length?t.scores.reduce((a,b)=>a+b,0)/t.scores.length:(t.g?t.pf/t.g:lm);t.mean=.72*avg+.28*lm;t.sd=t.scores.length>2?Math.max(8,Math.sqrt(t.scores.reduce((a,b)=>a+(b-avg)**2,0)/t.scores.length)):lsd;t.recent=t.scores.length?t.scores.slice(-3).reduce((a,b)=>a+b,0)/Math.min(3,t.scores.length):avg}
 let pfs=D.teams.map(t=>t.g?t.pf/t.g:t.mean), rec=D.teams.map(t=>t.recent);
 for(let t of D.teams){let wp=t.g?(t.w+.5*t.t)/t.g:.5,ap=t.allN?t.allW/t.allN:.5;t.expWins=ap*t.g;t.luck=t.w+.5*t.t-t.expWins;t.consistency=t.sd;t.power=100*(.35*wp+.30*rankPct(pfs,t.g?t.pf/t.g:t.mean)+.20*ap+.15*rankPct(rec,t.recent))}
}

function scheduleWeek(w){let groups={};for(let m of D.weeks[w-1]||[])(groups[m.matchup_id]??=[]).push(m);return Object.values(groups).filter(g=>g.length===2)}
function simulate(){
 let ids=D.teams.map(t=>t.id), C=Object.fromEntries(ids.map(id=>[id,{p:0,s:0,c:0}])), by=Object.fromEntries(D.teams.map(t=>[t.id,t])), start=Math.max(1,D.week), playoffN=Math.min(D.league.settings?.playoff_teams||7,D.teams.length);
 for(let z=0;z<SIMS;z++){let st=Object.fromEntries(D.teams.map(t=>[t.id,{w:t.w,pf:t.pf}]));
  for(let w=start;w<=D.regWeeks;w++)for(let g of scheduleWeek(w)){let a=by[g[0].roster_id],b=by[g[1].roster_id],sa=normal(a.mean,a.sd),sb=normal(b.mean,b.sd);st[a.id].pf+=sa;st[b.id].pf+=sb;if(sa>sb)st[a.id].w++;else st[b.id].w++}

  let alive=seeds.map(t=>t.id);

}

function seasonTrendData(){

function eloHistory(){
 let games=[...historicalGames()].sort((a,b)=>a.season-b.season||a.week-b.week),r={},peak={},trail={};
 for(let f of FRANCHISE_REGISTRY){r[f.name]=1500;peak[f.name]=1500;trail[f.name]=[]}
 for(let g of games){if(r[g.a]==null)r[g.a]=1500;if(r[g.b]==null)r[g.b]=1500;let ea=1/(1+Math.pow(10,(r[g.b]-r[g.a])/400)),sa=g.ap===g.bp?.5:g.ap>g.bp?1:0,k=g.type==="Playoffs"?32:24,da=k*(sa-ea);r[g.a]+=da;r[g.b]-=da;peak[g.a]=Math.max(peak[g.a]||1500,r[g.a]);peak[g.b]=Math.max(peak[g.b]||1500,r[g.b]);trail[g.a]??=[];trail[g.b]??=[];trail[g.a].push({season:g.season,week:g.week,r:r[g.a]});trail[g.b].push({season:g.season,week:g.week,r:r[g.b]})}
 return {rating:r,peak,trail}
}

}

function scenarioModel(forced){
 let N=2500,ids=D.teams.map(t=>t.id),C=Object.fromEntries(ids.map(id=>[id,{p:0,s:0,c:0}])),by=Object.fromEntries(D.teams.map(t=>[t.id,t])),start=Math.max(1,D.week),playoffN=Math.min(D.league.settings?.playoff_teams||7,D.teams.length);
 for(let z=0;z<N;z++){let st=Object.fromEntries(D.teams.map(t=>[t.id,{w:t.w,pf:t.pf}]));for(let w=start;w<=D.regWeeks;w++)for(let g of scheduleWeek(w)){let a=by[g[0].roster_id],b=by[g[1].roster_id],sa=normal(a.mean,a.sd),sb=normal(b.mean,b.sd);if(w===start&&forced&&(a.id===forced||b.id===forced)){if(a.id===forced&&sa<=sb)sa=sb+.01;if(b.id===forced&&sb<=sa)sb=sa+.01}st[a.id].pf+=sa;st[b.id].pf+=sb;if(sa>sb)st[a.id].w++;else st[b.id].w++}let seeds=[...D.teams].sort((a,b)=>st[b.id].w-st[a.id].w||st[b.id].pf-st[a.id].pf).slice(0,playoffN);seeds.forEach(t=>C[t.id].p++);if(seeds[0])C[seeds[0].id].s++;let alive=seeds.map(t=>t.id);if(alive.length===7){let bye=alive[0],pairs=[[alive[1],alive[6]],[alive[2],alive[5]],[alive[3],alive[4]]],wins=pairs.map(([a,b])=>normal(by[a].mean,by[a].sd)>normal(by[b].mean,by[b].sd)?a:b);alive=[bye,...wins]}while(alive.length>1){alive.sort((a,b)=>seeds.findIndex(x=>x.id===a)-seeds.findIndex(x=>x.id===b));let next=[];for(let i=0;i<alive.length/2;i++){let a=alive[i],b=alive[alive.length-1-i];next.push(normal(by[a].mean,by[a].sd)>normal(by[b].mean,by[b].sd)?a:b)}alive=next}if(alive[0])C[alive[0]].c++}return{C,N}
}
function scenarioLabHTML(){
 let groups=scheduleWeek(Math.min(D.week,D.regWeeks)),opts=groups.flatMap(g=>g.map(m=>D.teams.find(t=>t.id===m.roster_id))).filter(Boolean);if(!SCEN.pick||!opts.some(t=>String(t.id)===String(SCEN.pick)))SCEN.pick=String(opts[0]?.id||'');let pick=D.teams.find(t=>String(t.id)===String(SCEN.pick)),sim=pick?scenarioModel(pick.id):null;
 return `<div class="v8Hero"><div class="eyebrow">PLAYOFF SCENARIO LAB</div><h1>What if they win?</h1><p>Force a Week ${D.week} winner and rerun 2,500 conditional simulations to see how that result changes the postseason landscape.</p></div><div class="scenarioControls"><div><label>Force this week's winner</label><select onchange="scenarioPick(this.value)">${opts.map(t=>`<option value="${t.id}" ${String(t.id)===SCEN.pick?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div>${sim?`<div class="card wide"><table class="table"><tr><th>Franchise</th><th>Baseline Playoffs</th><th>Scenario Playoffs</th><th>Change</th><th>Baseline Title</th><th>Scenario Title</th></tr>${power().map(t=>{let bp=D.odds[t.id].p/SIMS,sp=sim.C[t.id].p/sim.N,bc=D.odds[t.id].c/SIMS,sc=sim.C[t.id].c/sim.N,d=sp-bp;return `<tr><td><b>${esc(t.name)}</b></td><td>${pct(bp)}</td><td><b>${pct(sp)}</b></td><td class="${d>=0?'deltaUp':'deltaDown'}">${d>=0?'+':''}${(100*d).toFixed(1)} pp</td><td>${pct(bc)}</td><td>${pct(sc)}</td></tr>`}).join('')}</table><p class="muted">Scenario results are simulation estimates and will vary slightly between runs. The selected Week ${D.week} winner is forced; all other remaining games are simulated from current scoring distributions.</p></div>`:''}`

async function loadHistory(){
 $("#app").innerHTML=`<div class="loading">Following LTE's Sleeper league history…</div>`;
 try{let id=LEAGUE_ID,seasons=[],seen=new Set();for(let n=0;n<15&&id&&!seen.has(id);n++){seen.add(id);let l=await get(`${API}/league/${id}`),[u,r,b]=await Promise.all([get(`${API}/league/${id}/users`),get(`${API}/league/${id}/rosters`),get(`${API}/league/${id}/winners_bracket`).catch(()=>[])]),um=Object.fromEntries(u.map(x=>[x.user_id,x])),max=Math.max(0,...b.map(x=>x.r||0)),final=b.find(x=>x.r===max&&x.w),champ=final?r.find(x=>x.roster_id===final.w):null,cu=champ?um[champ.owner_id]:null,reg=Math.max(1,(l.settings?.playoff_week_start||15)-1),maxWeek=String(l.season)===String(D.league?.season)?Math.max(1,D.week):Math.min(18,reg+3),weeks=await Promise.all(Array.from({length:maxWeek},(_,i)=>get(`${API}/league/${id}/matchups/${i+1}`).catch(()=>[])));seasons.push({season:l.season,name:l.name,champ:franchiseName(cu?.metadata?.team_name||cu?.display_name||"Not available"),rosters:r,users:um,weeks,reg,bracket:b});id=l.previous_league_id}D.history=seasons;render()}catch(e){D.history=[];render()}
}

function rawHistoricalName(s,r){
 let u=s.users[r.owner_id]||{};
 return u.metadata?.team_name||u.display_name||`Roster ${r.roster_id}`;
}
function canonicalName(s,r){return franchiseName(rawHistoricalName(s,r))}
function h2hData(){
 let map={};
 for(let s of D.history||[]){
  let rn=Object.fromEntries(s.rosters.map(r=>[r.roster_id,canonicalName(s,r)]));
  for(let wi=0;wi<(s.weeks||[]).length;wi++){
   let groups={};for(let m of s.weeks[wi]||[])(groups[m.matchup_id]??=[]).push(m);
   for(let g of Object.values(groups)){if(g.length!==2)continue;
    let a=g[0],b=g[1]; if(!(a.points>0||b.points>0))continue;
    let an=rn[a.roster_id],bn=rn[b.roster_id]; if(!an||!bn||an===bn)continue;
    let key=[an,bn].sort().join("|||"),x=map[key]??={a:[an,bn].sort()[0],b:[an,bn].sort()[1],games:[]};
    x.games.push({season:s.season,week:wi+1,type:(wi+1)>s.reg?"Playoffs":"Regular Season",an,bn,as:+a.points,bs:+b.points});
   }
  }
 }
 return Object.values(map);
}
function headToHeadHTML(){
 if(!D.history)return `<div class="loading">Building LTE rivalry database…</div>`;
 let pairs=h2hData(), names=[...new Set(pairs.flatMap(x=>[x.a,x.b]))].sort();
 let top=[...pairs].sort((a,b)=>b.games.length-a.games.length)[0],feature="";if(top){let aw=0,bw=0;for(let g of top.games){let xa=g.an===top.a?g.as:g.bs,xb=g.an===top.a?g.bs:g.as;if(xa>xb)aw++;else if(xb>xa)bw++}feature=`<div class="rivalryFeature"><div><div class="kpi">Most-Played Rivalry</div><h3>${esc(top.a)}</h3><div class="muted">${aw} wins</div></div><div class="vs">${top.games.length} MEETINGS</div><div class="right"><div class="kpi">Series</div><h3>${esc(top.b)}</h3><div class="muted">${bw} wins</div></div></div>`}return `<div class="hero"><div class="eyebrow">RIVALRY DATABASE</div><h1>Head-to-Head</h1><div class="muted">Complete rivalry history reconstructed from linked Sleeper seasons, including playoff meetings.</div></div>${feature}
 <div class="card wide"><h3 class="sectionTitle">All-Time Rivalry Records</h3>
 <table class="table"><tr><th>Matchup</th><th>Meetings</th><th>Series</th><th>PF</th><th>Point Diff</th><th>Last Meeting</th></tr>
 ${pairs.sort((x,y)=>y.games.length-x.games.length).map(x=>{
   let aw=0,bw=0,t=0,ap=0,bp=0;
   for(let g of x.games){let xa=g.an===x.a?g.as:g.bs, xb=g.an===x.a?g.bs:g.as;ap+=xa;bp+=xb;if(xa>xb)aw++;else if(xb>xa)bw++;else t++}
   let last=[...x.games].sort((g,h)=>Number(h.season)-Number(g.season)||h.week-g.week)[0],lead=aw===bw?`Tied ${aw}-${bw}`:aw>bw?`${esc(x.a)} ${aw}-${bw}`:`${esc(x.b)} ${bw}-${aw}`;
   return `<tr><td><b>${esc(x.a)}</b><br><span class="muted">vs ${esc(x.b)}</span></td><td>${x.games.length}</td><td>${lead}${t?`-${t}`:""}</td><td>${ap.toFixed(1)} / ${bp.toFixed(1)}</td><td>${(ap-bp)>=0?"+":""}${(ap-bp).toFixed(1)} ${esc(x.a)}</td><td>${esc(last.season)} W${last.week}<br><span class="muted">${last.type}</span></td></tr>`
 }).join("")}</table></div>
 <div class="card wide" style="margin-top:14px"><h3 class="sectionTitle">Franchise Rivalry Cards</h3><div class="teamGrid">
 ${names.map(n=>{let rows=pairs.filter(x=>x.a===n||x.b===n).map(x=>{let opp=x.a===n?x.b:x.a,w=0,l=0,t=0,pf=0,pa=0;for(let g of x.games){let mine=g.an===n?g.as:g.bs,other=g.an===n?g.bs:g.as;pf+=mine;pa+=other;if(mine>other)w++;else if(mine<other)l++;else t++}return{opp,w,l,t,pf,pa}}).sort((a,b)=>b.w-a.w||a.l-b.l);return `<div class="team"><h3>${esc(n)}</h3>${rows.map(r=>`<div style="padding:7px 0;border-bottom:1px solid #202b3a"><b>${esc(r.opp)}</b><span style="float:right">${r.w}-${r.l}${r.t?`-${r.t}`:""}</span><div class="muted">${r.pf.toFixed(1)} PF · ${r.pa.toFixed(1)} PA</div></div>`).join("")}</div>`}).join("")}
 </div></div>`;
}

let H2H_PICK={a:"",b:""};
function rivalrySummary(x){
 let aw=0,bw=0,t=0,ap=0,bp=0,playoffs=0,closest=null,blow=null,streak={team:"",n:0},cur={team:"",n:0};
 let games=[...x.games].sort((g,h)=>Number(g.season)-Number(h.season)||g.week-h.week);
 for(let g of games){let xa=g.an===x.a?g.as:g.bs,xb=g.an===x.a?g.bs:g.as,margin=Math.abs(xa-xb);ap+=xa;bp+=xb;if(g.type==="Playoffs")playoffs++;
  let win=xa>xb?x.a:xb>xa?x.b:"Tie"; if(xa>xb)aw++;else if(xb>xa)bw++;else t++;
  if(!closest||margin<closest.margin)closest={...g,margin,xa,xb,win};if(!blow||margin>blow.margin)blow={...g,margin,xa,xb,win};
  if(win!=="Tie"){if(cur.team===win)cur.n++;else cur={team:win,n:1};if(cur.n>streak.n)streak={...cur}}
 }
 let last=[...games].sort((g,h)=>Number(h.season)-Number(g.season)||h.week-g.week)[0];
 return{aw,bw,t,ap,bp,playoffs,closest,blow,streak,last,games,meetings:games.length,avgMargin:games.length?games.reduce((z,g)=>z+Math.abs(g.as-g.bs),0)/games.length:0};
}
function h2hSelect(side,val){H2H_PICK[side]=val;if(H2H_PICK.a===H2H_PICK.b){let names=[...new Set(h2hData().flatMap(x=>[x.a,x.b]))];H2H_PICK[side==='a'?'b':'a']=names.find(n=>n!==val)||""}render()}
function openRivalry(a,b){H2H_PICK={a,b};render();setTimeout(()=>document.querySelector('.h2hControls')?.scrollIntoView({behavior:'smooth',block:'start'}),30)}
function headToHeadHTML(){
 if(!D.history)return `<div class="loading">Building LTE Rivalry Center…</div>`;
 let pairs=h2hData(),names=[...new Set(pairs.flatMap(x=>[x.a,x.b]))].sort();if(names.length<2)return `<div class="error">Not enough rivalry history found.</div>`;
 if(!H2H_PICK.a||!names.includes(H2H_PICK.a))H2H_PICK.a=names[0];if(!H2H_PICK.b||!names.includes(H2H_PICK.b)||H2H_PICK.b===H2H_PICK.a)H2H_PICK.b=names.find(n=>n!==H2H_PICK.a);
 let pair=pairs.find(x=>(x.a===H2H_PICK.a&&x.b===H2H_PICK.b)||(x.a===H2H_PICK.b&&x.b===H2H_PICK.a));
 let most=[...pairs].sort((a,b)=>b.games.length-a.games.length)[0],close=[...pairs].map(x=>({x,s:rivalrySummary(x)})).sort((a,b)=>a.s.avgMargin-b.s.avgMargin)[0],oneSided=[...pairs].map(x=>({x,s:rivalrySummary(x)})).sort((a,b)=>Math.abs(b.s.aw-b.s.bw)-Math.abs(a.s.aw-a.s.bw))[0],play=[...pairs].map(x=>({x,s:rivalrySummary(x)})).sort((a,b)=>b.s.playoffs-a.s.playoffs)[0];
 let leaders=`<div class="rivalryLeaders"><div class="rivalryLeader acid"><div class="kpi">Most Played</div><strong>${esc(most.a)} × ${esc(most.b)}</strong><div>${most.games.length} meetings</div></div><div class="rivalryLeader"><div class="kpi">Tightest Rivalry</div><strong>${esc(close.x.a)} × ${esc(close.x.b)}</strong><div class="muted">${close.s.avgMargin.toFixed(1)} avg margin</div></div><div class="rivalryLeader"><div class="kpi">Most One-Sided</div><strong>${esc(oneSided.x.a)} × ${esc(oneSided.x.b)}</strong><div class="muted">${Math.max(oneSided.s.aw,oneSided.s.bw)}–${Math.min(oneSided.s.aw,oneSided.s.bw)} series</div></div><div class="rivalryLeader"><div class="kpi">Playoff History</div><strong>${esc(play.x.a)} × ${esc(play.x.b)}</strong><div class="muted">${play.s.playoffs} postseason meetings</div></div></div>`;
 let controls=`<div class="h2hControls"><div><label>Franchise A</label><select onchange="h2hSelect('a',this.value)">${names.map(n=>`<option ${n===H2H_PICK.a?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="h2hVs">VS</div><div><label>Franchise B</label><select onchange="h2hSelect('b',this.value)">${names.map(n=>`<option ${n===H2H_PICK.b?'selected':''}>${esc(n)}</option>`).join('')}</select></div></div>`;
 let detail='';if(pair){let s=rivalrySummary(pair),a=H2H_PICK.a,b=H2H_PICK.b,aw=a===pair.a?s.aw:s.bw,bw=a===pair.a?s.bw:s.aw,ap=a===pair.a?s.ap:s.bp,bp=a===pair.a?s.bp:s.ap;
  detail=`<div class="seriesHero"><div class="seriesSide"><div class="kpi">Franchise A</div><h2>${esc(a)}</h2><div class="muted">${ap.toFixed(1)} all-time points</div></div><div class="seriesScore"><span>All-Time Series</span><strong>${aw}–${bw}${s.t?`–${s.t}`:''}</strong><span>${s.meetings} meetings</span></div><div class="seriesSide right"><div class="kpi">Franchise B</div><h2>${esc(b)}</h2><div class="muted">${bp.toFixed(1)} all-time points</div></div></div><div class="h2hStats"><div class="h2hStat"><span>Point Differential</span><b>${Math.abs(ap-bp).toFixed(1)}</b></div><div class="h2hStat"><span>Avg Margin</span><b>${s.avgMargin.toFixed(1)}</b></div><div class="h2hStat"><span>Playoff Meetings</span><b>${s.playoffs}</b></div><div class="h2hStat"><span>Longest Streak</span><b>${s.streak.n}</b><small class="muted">${esc(s.streak.team)}</small></div><div class="h2hStat"><span>Closest Game</span><b>${s.closest?s.closest.margin.toFixed(2):'—'}</b></div><div class="h2hStat"><span>Biggest Blowout</span><b>${s.blow?s.blow.margin.toFixed(2):'—'}</b></div></div><div class="card wide"><div class="sectionHead" style="margin-top:0"><h2>Series Game Log</h2><span>Newest first</span></div><div class="gameLog">${[...s.games].reverse().map(g=>{let xa=g.an===a?g.as:g.bs,xb=g.an===a?g.bs:g.as;return `<div class="gameRow"><div><b>${esc(g.season)}</b><div class="muted">W${g.week}</div></div><div class="${xa>xb?'winner':''}">${esc(a)}</div><div class="gscore">${xa.toFixed(2)}–${xb.toFixed(2)}</div><div class="${xb>xa?'winner':''}">${esc(b)}</div><div><span class="badge ${g.type==='Playoffs'?'playoff':''}">${g.type}</span></div></div>`}).join('')}</div></div>`}
 let directory=`<div class="sectionHead"><h2>Rivalry Directory</h2><span>Tap any matchup to open the series</span></div><div class="rivalryDirectory">${pairs.map(x=>{let s=rivalrySummary(x);return `<div class="rivalryCard" onclick='openRivalry(${JSON.stringify(x.a)},${JSON.stringify(x.b)})'><div class="kpi">${s.meetings} meetings · ${s.playoffs} playoffs</div><h3>${esc(x.a)} <span class="muted">vs</span> ${esc(x.b)}</h3><div class="record">${s.aw}–${s.bw}${s.t?`–${s.t}`:''}</div><div class="muted">${s.avgMargin.toFixed(1)} avg margin · last ${esc(s.last.season)} W${s.last.week}</div></div>`}).join('')}</div>`;
 return `<div class="h2hHero"><div class="eyebrow">LTE INTELLIGENCE / RIVALRY CENTER</div><h1>Every series.<br>Every score.</h1><div class="muted">Choose any two franchises for their complete linked-Sleeper history, then explore the league's defining rivalries below.</div></div>${leaders}${controls}${detail}${directory}`;
}

function historyHTML(){
 if(!D.history)return `<div class="loading">Loading history…</div>`;
 if(page==="History"){let audit=registryAudit();return `<div class="hero"><div class="eyebrow">THE ARCHIVE / SINCE THE BEGINNING</div><h1>LTE Dynasty History</h1><div class="muted">${D.history.length} Sleeper seasons discovered automatically.</div></div>
 <div class="card wide" style="margin-bottom:14px"><h3 class="sectionTitle">Franchise Registry Audit</h3>

 </div><div class="teamGrid">${D.history.map(s=>`<div class="team"><span class="pill">${esc(s.season)}</span><h3>${esc(s.champ)}</h3><div class="muted">League Champion</div></div>`).join("")}</div>`}
 let agg={};for(let s of D.history)for(let r of s.rosters){let name=canonicalName(s,r),k=normName(name),a=agg[k]??={name,w:0,l:0,pf:0,seasons:0,titles:0};a.w+=r.settings?.wins||0;a.l+=r.settings?.losses||0;a.pf+=pf(r);a.seasons++}for(let s of D.history){let a=Object.values(agg).find(x=>x.name===s.champ);if(a)a.titles++}
 let arr=Object.values(agg).sort((a,b)=>b.w-a.w||b.pf-a.pf);return `<div class="grid"><div class="card wide"><h3 class="sectionTitle">LTE Record Book</h3><p class="muted">Aggregated from the Sleeper seasons linked to the current league.</p><table class="table"><tr><th>Franchise</th><th>Seasons</th><th>Record</th><th>Win %</th><th>PF</th><th>PF / Season</th><th>Titles</th></tr>${arr.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${a.seasons}</td><td>${a.w}-${a.l}</td><td>${pct(a.w/Math.max(1,a.w+a.l))}</td><td>${a.pf.toFixed(1)}</td><td>${(a.pf/Math.max(1,a.seasons)).toFixed(1)}</td><td>${a.titles}</td></tr>`).join("")}</table></div></div>`
