<body>
<div class="shell">
<div class="top"><div class="brand"><b>LTE DYNASTY HQ</b><span id="sub">Loading league intelligence…</span></div><div class="live">● LIVE SLEEPER DATA</div></div>
<div class="nav" id="nav"></div><main class="main" id="app"><div class="loading">Building LTE Dynasty HQ…</div></main>
<div class="foot">LTE Dynasty HQ v4.0 · Unofficial league analytics · Data via Sleeper</div>
</div>
<script>
const LEAGUE_ID="1335326900251271168", API="https://api.sleeper.app/v1", SIMS=12000;
let D={league:null,state:null,teams:[],weeks:[],week:1,regWeeks:14,history:null}, page="HQ";

const FRANCHISE_REGISTRY=[
 {name:"Reconstruction Phase 📈",aliases:["Reconstruction Phase 📈","Reconstruction Phase"]},
 {name:"Gramercy Rental Hogs",aliases:["Gramercy Rental Hogs","Oklahoma City Thunder","King Scum LLC","Team Plum"]},
 {name:"Fish & Chips",aliases:["Fish & Chips","Gfish22"]},
 {name:"Buddha Bear",aliases:["Buddha Bear","Team Wertheimer","Codan Livheimer","Codan Livneimer","B’nai Yisrael","B' nai Yisrael","B'nai Yisrael"]},
 {name:"Keepin up w/ the Joneses",aliases:["Keepin up w/ the Joneses","Keeping up w/ the Jonses","Keeping Up w/ The Jonses","🐀Bonnie shmedlin🐀"]},
 {name:"Team Indianajosh1862",aliases:["Team Indianajosh1862"]},
 {name:"Oy Lchaim Lchaim 🎶🎶",aliases:["Oy Lchaim Lchaim 🎶🎶","Oy Lchaim Lchaim","DAWID Arthega-Whitethide"]},
 {name:"I love my team so much",aliases:["I love my team so much","Creakmen","Creak boys","Creak"]},
 {name:"Borkinators",aliases:["Borkinators","Danielle Mirzakandov","Strikhov","Strikhov Infirmary","The BorkSheveiks"]},
 {name:"Satya Sai Remediation Co.",aliases:["Satya Sai Remediation Co.","Satyas Species of Warfare","Satyas Species O' Warfare","Satya Sai's TE Academy","Satya Sai Baba"]},
 {name:"Bopped-Tolo Colon",aliases:["Bopped-Tolo Colon","BoptoloColon","Bumtolo Colon"]},
 {name:"Rvrnd Revsins Rglr Resin",aliases:["Rvrnd Revsins Rglr Resin","Rev Revzins Regular Resin"]}
];
function normName(v){return String(v||"").normalize("NFKC").trim().toLowerCase().replace(/\s+/g," ")}
const ALIAS_MAP=(()=>{let m={};for(let f of FRANCHISE_REGISTRY)for(let a of f.aliases)m[normName(a)]=f.name;return m})();
function franchiseName(raw){return ALIAS_MAP[normName(raw)]||raw}
function registryAudit(){
 let found=new Map();
 for(let s of D.history||[])for(let r of s.rosters){
   let raw=rawHistoricalName(s,r); if(!raw)continue;
   let k=normName(raw); if(!ALIAS_MAP[k]){
     let x=found.get(k)||{name:raw,seasons:new Set()};
     x.seasons.add(String(s.season));found.set(k,x)
   }
 }
 return [...found.values()].map(x=>({name:x.name,seasons:[...x.seasons].sort()})).sort((a,b)=>a.name.localeCompare(b.name))
}

const pages=["HQ","League Pulse","Weekly","Playoff Race","Awards","Power Rankings","Odds","Matchups","Franchises","League Records","Head-to-Head","History","Record Book"];
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function get(u){let r=await fetch(u);if(!r.ok)throw Error("Sleeper API "+r.status);return r.json()}
function nav(){ $("#nav").innerHTML=pages.map(x=>`<button class="${x===page?"on":""}" onclick="go('${x}')">${x}</button>`).join("") }
function go(x){page=x;nav(); if((x==="History"||x==="Record Book"||x==="Head-to-Head"||x==="League Records"||x==="Franchises"||x==="League Pulse"||x==="Awards"||x==="Playoff Race")&&!D.history) loadHistory(); else render()}
function pf(r){return +(Number(r.settings?.fpts||0)+(Number(r.settings?.fpts_decimal||0)/100)).toFixed(2)}
function games(t){return t.w+t.l+t.t}
function pct(x){return (100*x).toFixed(x>.095?1:2)+"%"}
function rankPct(a,v){if(a.length<2)return .5;return a.filter(x=>x<v).length/(a.length-1)}
function normal(mean,sd){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.max(0,mean+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v))}
async function load(){
 try{
  const [league,state,users,rosters]=await Promise.all([get(`${API}/league/${LEAGUE_ID}`),get(`${API}/state/nfl`),get(`${API}/league/${LEAGUE_ID}/users`),get(`${API}/league/${LEAGUE_ID}/rosters`)]);
  D.league=league;D.state=state;D.week=Math.max(1,state.week||1);D.regWeeks=Math.max(1,(league.settings?.playoff_week_start||15)-1);
  const um=Object.fromEntries(users.map(u=>[u.user_id,u]));
  D.teams=rosters.map(r=>{let u=um[r.owner_id]||{},g=(r.settings?.wins||0)+(r.settings?.losses||0)+(r.settings?.ties||0);return{id:r.roster_id,owner:r.owner_id,name:franchiseName(u.metadata?.team_name||u.display_name||`Roster ${r.roster_id}`),display:u.display_name||"",w:r.settings?.wins||0,l:r.settings?.losses||0,t:r.settings?.ties||0,pf:pf(r),g,scores:[],allW:0,allN:0,recent:0,mean:0,sd:15}});
  D.weeks=await Promise.all(Array.from({length:D.regWeeks},(_,i)=>get(`${API}/league/${LEAGUE_ID}/matchups/${i+1}`).catch(()=>[])));
  buildMetrics();simulate();$("#sub").textContent=`${league.name||"LTE Dynasty"} · ${league.season} · Week ${D.week}`;nav();render();
 }catch(e){$("#app").innerHTML=`<div class="error"><b>Could not load LTE data.</b><br>${esc(e.message)}<br><span class="muted">Refresh the page and try again.</span></div>`}
}
function buildMetrics(){
 let completed=Math.min(D.regWeeks,Math.max(0,D.week-1)), leagueScores=[];
 for(let wi=0;wi<completed;wi++){let ms=D.weeks[wi]||[],scores=ms.filter(m=>m.points>0).map(m=>m.points);leagueScores.push(...scores);for(let m of ms){let t=D.teams.find(x=>x.id===m.roster_id);if(!t||m.points<=0)continue;t.scores.push(m.points);for(let s of scores)if(s!==m.points){t.allN++;if(m.points>s)t.allW++;else if(m.points===s)t.allW+=.5}}}

function h2hData(){
 let map={};
 for(let s of D.history||[]){
  let rn=Object.fromEntries(s.rosters.map(r=>[r.roster_id,canonicalName(s,r)]));
  for(let wi=0;wi<(s.weeks||[]).length;wi++){
   let groups={};for(let m of s.weeks[wi]||[])(groups[m.matchup_id]??=[]).push(m);
   for(let g of Object.values(groups)){if(g.length!==2)continue;
    let a=g[0],b=g[1]; if(!(a.points>0||b.points>0))continue;
    let an=rn[a.roster_id],bn=rn[b.roster_id]; if(!an||!bn||an===bn)continue;
    let key=[an,bn].sort().join("|||"),x=map[key]??={a:[an,bn].sort()[0],b:[an,bn].sort()[1],games:[]};
    x.games.push({season:s.season,week:wi+1,type:(wi+1)>s.reg?"Playoffs":"Regular Season",an,bn,as:+a.points,bs:+b.points});
   }
  }
 }
 return Object.values(map);
}

 let agg={};for(let s of D.history)for(let r of s.rosters){let name=canonicalName(s,r),k=normName(name),a=agg[k]??={name,w:0,l:0,pf:0,seasons:0,titles:0};a.w+=r.settings?.wins||0;a.l+=r.settings?.losses||0;a.pf+=pf(r);a.seasons++}for(let s of D.history){let a=Object.values(agg).find(x=>x.name===s.champ);if(a)a.titles++}
 let arr=Object.values(agg).sort((a,b)=>b.w-a.w||b.pf-a.pf);return `<div class="grid"><div class="card wide"><h3 class="sectionTitle">LTE Record Book</h3><p class="muted">Aggregated from the Sleeper seasons linked to the current league.</p><table class="table"><tr><th>Franchise</th><th>Seasons</th><th>Record</th><th>Win %</th><th>PF</th><th>PF / Season</th><th>Titles</th></tr>${arr.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${a.seasons}</td><td>${a.w}-${a.l}</td><td>${pct(a.w/Math.max(1,a.w+a.l))}</td><td>${a.pf.toFixed(1)}</td><td>${(a.pf/Math.max(1,a.seasons)).toFixed(1)}</td><td>${a.titles}</td></tr>`).join("")}</table></div></div>`
}
