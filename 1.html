<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LTE Dynasty HQ</title>
<style>
:root{--bg:#070a0f;--panel:#0e141d;--panel2:#121b27;--line:#233044;--text:#f4f7fb;--muted:#8fa0b5;--blue:#4aa3ff;--green:#44d19d;--gold:#f6c85f;--red:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#162c4a 0,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
button,select{font:inherit}.shell{max-width:1250px;margin:auto}.top{padding:24px 18px 15px;display:flex;justify-content:space-between;gap:15px;align-items:center}.brand b{font-size:27px;letter-spacing:-.8px}.brand span{display:block;color:var(--muted);margin-top:3px}.live{border:1px solid #255b49;background:#102a22;color:#6ee7b7;border-radius:999px;padding:7px 10px;font-weight:800;font-size:11px}.nav{position:sticky;top:0;z-index:9;display:flex;gap:7px;overflow:auto;padding:10px 18px;background:#080c12e8;backdrop-filter:blur(12px);border-block:1px solid var(--line)}
.nav button{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:9px;font-weight:700}.nav button.on{background:#182334;color:#fff}.main{padding:18px}.hero{padding:25px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#152236,#0d131c);margin-bottom:16px}.eyebrow{font-size:11px;color:#7eb8ff;font-weight:900;letter-spacing:1.5px}.hero h1{font-size:34px;margin:6px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 6;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:17px;overflow:auto}.wide{grid-column:span 12}.third{grid-column:span 4}.stat{font-size:27px;font-weight:900}.kpi{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}.sectionTitle{font-size:17px;font-weight:850;margin:0 0 12px}.table{width:100%;border-collapse:collapse;min-width:580px}.table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px}.table td,.table th{padding:10px 7px;border-bottom:1px solid #202b3a}.rank{font-size:18px;font-weight:900}.pill{font-size:10px;border-radius:999px;padding:4px 7px;background:#192536;color:#9ccaff}.up{color:var(--green)}.down{color:var(--red)}.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #202b3a}.right{text-align:right}.score{font-size:20px;font-weight:900}.bar{height:7px;background:#1b2634;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#348cf1,#62d6ff);border-radius:10px}.teamGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.team{border:1px solid var(--line);background:#0b1119;border-radius:13px;padding:14px}.team b{font-size:15px}.loading{text-align:center;padding:80px 20px;color:var(--muted)}.error{border:1px solid #6b3030;background:#231313;padding:18px;border-radius:14px}.foot{text-align:center;color:#5e6b7b;padding:35px 15px 50px;font-size:11px}
@media(max-width:760px){.card,.third{grid-column:span 12}.hero h1{font-size:27px}.main{padding:12px}.top{padding:18px 14px}.nav{padding-inline:12px}}
</style>
</head>
<body>
<div class="shell">
<div class="top"><div class="brand"><b>LTE DYNASTY HQ</b><span id="sub">Loading league intelligence…</span></div><div class="live">● LIVE SLEEPER DATA</div></div>
<div class="nav" id="nav"></div><main class="main" id="app"><div class="loading">Building LTE Dynasty HQ…</div></main>
<div class="foot">LTE Dynasty HQ v1.1 · Unofficial league analytics · Data via Sleeper</div>
</div>
<script>
const LEAGUE_ID="1335326900251271168", API="https://api.sleeper.app/v1", SIMS=12000;
let D={league:null,state:null,teams:[],weeks:[],week:1,regWeeks:14,history:null}, page="HQ";
const pages=["HQ","Power Rankings","Odds","Matchups","Franchises","Head-to-Head","History","Record Book"];
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function get(u){let r=await fetch(u);if(!r.ok)throw Error("Sleeper API "+r.status);return r.json()}
function nav(){ $("#nav").innerHTML=pages.map(x=>`<button class="${x===page?"on":""}" onclick="go('${x}')">${x}</button>`).join("") }
function go(x){page=x;nav(); if((x==="History"||x==="Record Book"||x==="Head-to-Head")&&!D.history) loadHistory(); else render()}
function pf(r){return +(Number(r.settings?.fpts||0)+(Number(r.settings?.fpts_decimal||0)/100)).toFixed(2)}
function games(t){return t.w+t.l+t.t}
function pct(x){return (100*x).toFixed(x>.095?1:2)+"%"}
function rankPct(a,v){if(a.length<2)return .5;return a.filter(x=>x<v).length/(a.length-1)}
function normal(mean,sd){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.max(0,mean+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v))}
async function load(){
 try{
  const [league,state,users,rosters]=await Promise.all([get(`${API}/league/${LEAGUE_ID}`),get(`${API}/state/nfl`),get(`${API}/league/${LEAGUE_ID}/users`),get(`${API}/league/${LEAGUE_ID}/rosters`)]);
  D.league=league;D.state=state;D.week=Math.max(1,state.week||1);D.regWeeks=Math.max(1,(league.settings?.playoff_week_start||15)-1);
  const um=Object.fromEntries(users.map(u=>[u.user_id,u]));
  D.teams=rosters.map(r=>{let u=um[r.owner_id]||{},g=(r.settings?.wins||0)+(r.settings?.losses||0)+(r.settings?.ties||0);return{id:r.roster_id,owner:r.owner_id,name:u.metadata?.team_name||u.display_name||`Roster ${r.roster_id}`,display:u.display_name||"",w:r.settings?.wins||0,l:r.settings?.losses||0,t:r.settings?.ties||0,pf:pf(r),g,scores:[],allW:0,allN:0,recent:0,mean:0,sd:15}});
  D.weeks=await Promise.all(Array.from({length:D.regWeeks},(_,i)=>get(`${API}/league/${LEAGUE_ID}/matchups/${i+1}`).catch(()=>[])));
  buildMetrics();simulate();$("#sub").textContent=`${league.name||"LTE Dynasty"} · ${league.season} · Week ${D.week}`;nav();render();
 }catch(e){$("#app").innerHTML=`<div class="error"><b>Could not load LTE data.</b><br>${esc(e.message)}<br><span class="muted">Refresh the page and try again.</span></div>`}
}
function buildMetrics(){
 let completed=Math.min(D.regWeeks,Math.max(0,D.week-1)), leagueScores=[];
 for(let wi=0;wi<completed;wi++){let ms=D.weeks[wi]||[],scores=ms.filter(m=>m.points>0).map(m=>m.points);leagueScores.push(...scores);for(let m of ms){let t=D.teams.find(x=>x.id===m.roster_id);if(!t||m.points<=0)continue;t.scores.push(m.points);for(let s of scores)if(s!==m.points){t.allN++;if(m.points>s)t.allW++;else if(m.points===s)t.allW+=.5}}}
 let lm=leagueScores.length?leagueScores.reduce((a,b)=>a+b,0)/leagueScores.length:100;
 let lsd=leagueScores.length?Math.sqrt(leagueScores.reduce((a,b)=>a+(b-lm)**2,0)/leagueScores.length):15;lsd=Math.max(10,lsd);
 for(let t of D.teams){let avg=t.scores.length?t.scores.reduce((a,b)=>a+b,0)/t.scores.length:(t.g?t.pf/t.g:lm);t.mean=.72*avg+.28*lm;t.sd=t.scores.length>2?Math.max(8,Math.sqrt(t.scores.reduce((a,b)=>a+(b-avg)**2,0)/t.scores.length)):lsd;t.recent=t.scores.length?t.scores.slice(-3).reduce((a,b)=>a+b,0)/Math.min(3,t.scores.length):avg}
 let pfs=D.teams.map(t=>t.g?t.pf/t.g:t.mean), rec=D.teams.map(t=>t.recent);
 for(let t of D.teams){let wp=t.g?(t.w+.5*t.t)/t.g:.5,ap=t.allN?t.allW/t.allN:.5;t.power=100*(.35*wp+.30*rankPct(pfs,t.g?t.pf/t.g:t.mean)+.20*ap+.15*rankPct(rec,t.recent))}
}
function sorted(){return [...D.teams].sort((a,b)=>b.w-a.w||b.pf-a.pf)}
function power(){return [...D.teams].sort((a,b)=>b.power-a.power)}
function scheduleWeek(w){let groups={};for(let m of D.weeks[w-1]||[])(groups[m.matchup_id]??=[]).push(m);return Object.values(groups).filter(g=>g.length===2)}
function simulate(){
 let ids=D.teams.map(t=>t.id), C=Object.fromEntries(ids.map(id=>[id,{p:0,s:0,c:0}])), by=Object.fromEntries(D.teams.map(t=>[t.id,t])), start=Math.max(1,D.week), playoffN=Math.min(D.league.settings?.playoff_teams||7,D.teams.length);
 for(let z=0;z<SIMS;z++){let st=Object.fromEntries(D.teams.map(t=>[t.id,{w:t.w,pf:t.pf}]));
  for(let w=start;w<=D.regWeeks;w++)for(let g of scheduleWeek(w)){let a=by[g[0].roster_id],b=by[g[1].roster_id],sa=normal(a.mean,a.sd),sb=normal(b.mean,b.sd);st[a.id].pf+=sa;st[b.id].pf+=sb;if(sa>sb)st[a.id].w++;else st[b.id].w++}
  let seeds=[...D.teams].sort((a,b)=>st[b.id].w-st[a.id].w||st[b.id].pf-st[a.id].pf).slice(0,playoffN);seeds.forEach(t=>C[t.id].p++);if(seeds[0])C[seeds[0].id].s++;
  let alive=seeds.map(t=>t.id);
  if(alive.length===7){let bye=alive[0],pairs=[[alive[1],alive[6]],[alive[2],alive[5]],[alive[3],alive[4]]],wins=pairs.map(([a,b])=>normal(by[a].mean,by[a].sd)>normal(by[b].mean,by[b].sd)?a:b);alive=[bye,...wins]}
  while(alive.length>1){alive.sort((a,b)=>seeds.findIndex(x=>x.id===a)-seeds.findIndex(x=>x.id===b));let next=[];for(let i=0;i<alive.length/2;i++){let a=alive[i],b=alive[alive.length-1-i];next.push(normal(by[a].mean,by[a].sd)>normal(by[b].mean,by[b].sd)?a:b)}alive=next}
  if(alive[0])C[alive[0]].c++;
 }D.odds=C
}
function tableRows(list,kind="stand"){return list.map((t,i)=>`<tr><td class="rank">${i+1}</td><td><b>${esc(t.name)}</b><div class="muted">${esc(t.display)}</div></td>${kind==="power"?`<td>${t.power.toFixed(1)}</td><td>${t.recent.toFixed(1)}</td><td>${t.allN?pct(t.allW/t.allN):"—"}</td>`:`<td>${t.w}-${t.l}${t.t?`-${t.t}`:""}</td><td>${t.pf.toFixed(1)}</td><td>${games(t)?(t.pf/games(t)).toFixed(1):"—"}</td>`}</tr>`).join("")}
function standingsCard(){return `<div class="card"><h3 class="sectionTitle">Standings</h3><table class="table"><tr><th>#</th><th>Franchise</th><th>Record</th><th>PF</th><th>Avg</th></tr>${tableRows(sorted())}</table></div>`}
function matchupCard(){let groups=scheduleWeek(Math.min(D.week,D.regWeeks));return `<div class="card"><h3 class="sectionTitle">Week ${D.week} Matchup Center</h3>${groups.map(g=>{let a=D.teams.find(t=>t.id===g[0].roster_id),b=D.teams.find(t=>t.id===g[1].roster_id);return `<div class="match"><div><b>${esc(a.name)}</b><div class="muted">${g[0].points?.toFixed?.(2)||"0.00"}</div></div><span class="pill">VS</span><div class="right"><b>${esc(b.name)}</b><div class="muted">${g[1].points?.toFixed?.(2)||"0.00"}</div></div></div>`}).join("")||`<span class="muted">No matchup data.</span>`}</div>`}
function oddsTable(){return `<div class="card wide"><h3 class="sectionTitle">12,000-Simulation Championship Model</h3><p class="muted">Uses current standings, remaining Sleeper schedule, each franchise's scoring distribution, and a 7-team playoff bracket.</p><table class="table"><tr><th>Franchise</th><th>Playoffs</th><th>#1 Seed</th><th>Champion</th><th>Title Probability</th></tr>${power().map(t=>{let o=D.odds[t.id];return `<tr><td><b>${esc(t.name)}</b></td><td>${pct(o.p/SIMS)}</td><td>${pct(o.s/SIMS)}</td><td><b>${pct(o.c/SIMS)}</b></td><td><div class="bar"><i style="width:${100*o.c/SIMS}%"></i></div></td></tr>`}).join("")}</table><p class="muted">Model probabilities are league analytics, not sportsbook odds. Standings ties are modeled using points-for as the tiebreaker.</p></div>`}
function render(){
 let h="";
 if(page==="HQ"){let leader=sorted()[0],pr=power()[0];h=`<div class="hero"><div class="eyebrow">2026 · LEAGUE COMMAND CENTER</div><h1>${esc(D.league.name||"LTE Dynasty")}</h1><div class="muted">Week ${D.week} · ${D.teams.length} franchises · ${D.league.settings?.playoff_teams||7} playoff spots · Live Sleeper sync</div></div><div class="grid"><div class="card third"><div class="kpi">Current #1 Seed</div><div class="stat">${esc(leader?.name)}</div></div><div class="card third"><div class="kpi">Model Power #1</div><div class="stat">${esc(pr?.name)}</div></div><div class="card third"><div class="kpi">Simulations</div><div class="stat">${SIMS.toLocaleString()}</div></div>${standingsCard()}${matchupCard()}</div>`}
 if(page==="Power Rankings")h=`<div class="grid"><div class="card wide"><h3 class="sectionTitle">Blind Power Rankings</h3><p class="muted">Names are attached only after calculation. Rating: 35% record, 30% scoring, 20% all-play, 15% recent form.</p><table class="table"><tr><th>#</th><th>Franchise</th><th>Rating</th><th>Last 3 Avg</th><th>All-Play</th></tr>${tableRows(power(),"power")}</table></div></div>`;
 if(page==="Odds")h=`<div class="grid">${oddsTable()}</div>`;
 if(page==="Matchups")h=`<div class="grid">${matchupCard()}<div class="card"><h3 class="sectionTitle">Scoring Form</h3>${power().map(t=>`<div style="margin:12px 0"><b>${esc(t.name)}</b><span class="muted"> · ${t.recent.toFixed(1)} recent avg</span><div class="bar"><i style="width:${Math.min(100,t.recent/2)}%"></i></div></div>`).join("")}</div></div>`;
 if(page==="Franchises")h=`<div class="hero"><div class="eyebrow">THE 12</div><h1>LTE Franchises</h1><div class="muted">Current-season franchise profiles and analytics.</div></div><div class="teamGrid">${power().map((t,i)=>`<div class="team"><span class="pill">Power #${i+1}</span><h3>${esc(t.name)}</h3><div class="muted">${esc(t.display)}</div><p><b>${t.w}-${t.l}</b> · ${t.pf.toFixed(1)} PF</p><div class="kpi">Championship probability</div><div class="stat">${pct(D.odds[t.id].c/SIMS)}</div></div>`).join("")}</div>`;
 if(page==="Head-to-Head")h=headToHeadHTML();
 if(page==="History"||page==="Record Book")h=historyHTML();
 $("#app").innerHTML=h
}
async function loadHistory(){
 $("#app").innerHTML=`<div class="loading">Following LTE's Sleeper league history…</div>`;
 try{let id=LEAGUE_ID,seasons=[],seen=new Set();for(let n=0;n<15&&id&&!seen.has(id);n++){seen.add(id);let l=await get(`${API}/league/${id}`),[u,r,b]=await Promise.all([get(`${API}/league/${id}/users`),get(`${API}/league/${id}/rosters`),get(`${API}/league/${id}/winners_bracket`).catch(()=>[])]),um=Object.fromEntries(u.map(x=>[x.user_id,x])),max=Math.max(0,...b.map(x=>x.r||0)),final=b.find(x=>x.r===max&&x.w),champ=final?r.find(x=>x.roster_id===final.w):null,cu=champ?um[champ.owner_id]:null,reg=Math.max(1,(l.settings?.playoff_week_start||15)-1),weeks=await Promise.all(Array.from({length:reg},(_,i)=>get(`${API}/league/${id}/matchups/${i+1}`).catch(()=>[])));seasons.push({season:l.season,name:l.name,champ:cu?.metadata?.team_name||cu?.display_name||"Not available",rosters:r,users:um,weeks});id=l.previous_league_id}D.history=seasons;render()}catch(e){D.history=[];render()}
}

function canonicalName(s,r){
 let u=s.users[r.owner_id]||{};
 return u.metadata?.team_name||u.display_name||`Roster ${r.roster_id}`;
}
function h2hData(){
 let map={};
 for(let s of D.history||[]){
  let rn=Object.fromEntries(s.rosters.map(r=>[r.roster_id,canonicalName(s,r)]));
  for(let wi=0;wi<(s.weeks||[]).length;wi++){
   let groups={};for(let m of s.weeks[wi]||[])(groups[m.matchup_id]??=[]).push(m);
   for(let g of Object.values(groups)){if(g.length!==2)continue;
    let a=g[0],b=g[1]; if(!(a.points>0||b.points>0))continue;
    let an=rn[a.roster_id],bn=rn[b.roster_id]; if(!an||!bn||an===bn)continue;
    let key=[an,bn].sort().join("|||"),x=map[key]??={a:[an,bn].sort()[0],b:[an,bn].sort()[1],games:[]};
    x.games.push({season:s.season,week:wi+1,an,bn,as:+a.points,bs:+b.points});
   }
  }
 }
 return Object.values(map);
}
function headToHeadHTML(){
 if(!D.history)return `<div class="loading">Building LTE rivalry database…</div>`;
 let pairs=h2hData(), names=[...new Set(pairs.flatMap(x=>[x.a,x.b]))].sort();
 return `<div class="hero"><div class="eyebrow">RIVALRY DATABASE</div><h1>Head-to-Head</h1><div class="muted">Historical regular-season results reconstructed from every linked Sleeper season.</div></div>
 <div class="card wide"><h3 class="sectionTitle">All-Time Rivalry Records</h3>
 <table class="table"><tr><th>Matchup</th><th>Meetings</th><th>Series</th><th>PF</th><th>Point Diff</th><th>Last Meeting</th></tr>
 ${pairs.sort((x,y)=>y.games.length-x.games.length).map(x=>{
   let aw=0,bw=0,t=0,ap=0,bp=0;
   for(let g of x.games){let xa=g.an===x.a?g.as:g.bs, xb=g.an===x.a?g.bs:g.as;ap+=xa;bp+=xb;if(xa>xb)aw++;else if(xb>xa)bw++;else t++}
   let last=x.games[x.games.length-1],lead=aw===bw?`Tied ${aw}-${bw}`:aw>bw?`${esc(x.a)} ${aw}-${bw}`:`${esc(x.b)} ${bw}-${aw}`;
   return `<tr><td><b>${esc(x.a)}</b><br><span class="muted">vs ${esc(x.b)}</span></td><td>${x.games.length}</td><td>${lead}${t?`-${t}`:""}</td><td>${ap.toFixed(1)} / ${bp.toFixed(1)}</td><td>${(ap-bp)>=0?"+":""}${(ap-bp).toFixed(1)} ${esc(x.a)}</td><td>${esc(last.season)} W${last.week}</td></tr>`
 }).join("")}</table></div>
 <div class="card wide" style="margin-top:14px"><h3 class="sectionTitle">Franchise Rivalry Cards</h3><div class="teamGrid">
 ${names.map(n=>{let rows=pairs.filter(x=>x.a===n||x.b===n).map(x=>{let opp=x.a===n?x.b:x.a,w=0,l=0,t=0,pf=0,pa=0;for(let g of x.games){let mine=g.an===n?g.as:g.bs,other=g.an===n?g.bs:g.as;pf+=mine;pa+=other;if(mine>other)w++;else if(mine<other)l++;else t++}return{opp,w,l,t,pf,pa}}).sort((a,b)=>b.w-a.w||a.l-b.l);return `<div class="team"><h3>${esc(n)}</h3>${rows.map(r=>`<div style="padding:7px 0;border-bottom:1px solid #202b3a"><b>${esc(r.opp)}</b><span style="float:right">${r.w}-${r.l}${r.t?`-${r.t}`:""}</span><div class="muted">${r.pf.toFixed(1)} PF · ${r.pa.toFixed(1)} PA</div></div>`).join("")}</div>`}).join("")}
 </div></div>`;
}
function historyHTML(){
 if(!D.history)return `<div class="loading">Loading history…</div>`;
 if(page==="History")return `<div class="hero"><div class="eyebrow">THE ARCHIVE</div><h1>LTE Dynasty History</h1><div class="muted">${D.history.length} Sleeper seasons discovered automatically.</div></div><div class="teamGrid">${D.history.map(s=>`<div class="team"><span class="pill">${esc(s.season)}</span><h3>${esc(s.champ)}</h3><div class="muted">League Champion</div></div>`).join("")}</div>`;
 let agg={};for(let s of D.history)for(let r of s.rosters){let u=s.users[r.owner_id]||{},k=r.owner_id||`r${r.roster_id}`,a=agg[k]??={name:u.metadata?.team_name||u.display_name||"Unknown",w:0,l:0,pf:0,seasons:0,titles:0};a.w+=r.settings?.wins||0;a.l+=r.settings?.losses||0;a.pf+=pf(r);a.seasons++}for(let s of D.history){let a=Object.values(agg).find(x=>x.name===s.champ);if(a)a.titles++}
 let arr=Object.values(agg).sort((a,b)=>b.w-a.w||b.pf-a.pf);return `<div class="grid"><div class="card wide"><h3 class="sectionTitle">LTE Record Book</h3><p class="muted">Aggregated from the Sleeper seasons linked to the current league.</p><table class="table"><tr><th>Franchise / Owner</th><th>Seasons</th><th>Wins</th><th>Losses</th><th>PF</th><th>Titles</th></tr>${arr.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${a.seasons}</td><td>${a.w}</td><td>${a.l}</td><td>${a.pf.toFixed(1)}</td><td>${a.titles}</td></tr>`).join("")}</table></div></div>`
}
load();
</script>
</body></html>
